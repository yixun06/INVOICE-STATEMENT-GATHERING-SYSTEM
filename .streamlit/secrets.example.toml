# Copy the relevant mode to .streamlit/secrets.toml locally, or set the same
# values in Streamlit Community Cloud Secrets. Never commit secrets.toml.

# Mode 1: local service-account JSON file path.
[product_master]
source = "google_sheets"
google_credentials_path = "D:/path/to/service-account.json"
google_spreadsheet_id = "your-spreadsheet-id"
google_worksheet_name = "shopee"

# Mode 2: Streamlit Community Cloud service-account details.
# Use this instead of google_credentials_path when deploying to Streamlit Cloud.
# [product_master]
# source = "google_sheets"
# google_spreadsheet_id = "your-spreadsheet-id"
# google_worksheet_name = "shopee"
# [product_master.google_service_account]
# type = "service_account"
# project_id = "your-gcp-project-id"
# private_key_id = "your-private-key-id"
# private_key = "-----BEGIN PRIVATE KEY-----\\nreplace-with-your-key\\n-----END PRIVATE KEY-----\\n"
# client_email = "your-service-account@your-gcp-project.iam.gserviceaccount.com"
# client_id = "your-client-id"
# token_uri = "https://oauth2.googleapis.com/token"

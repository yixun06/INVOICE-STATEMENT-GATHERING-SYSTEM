[theme]
base = "light"
primaryColor = "#14532D"
backgroundColor = "#FCFDFB"
secondaryBackgroundColor = "#F5F8F2"
textColor = "#17211B"
linkColor = "#166534"
borderColor = "#E0E8DC"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "9px"
buttonRadius = "9px"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
linkUnderline = false
greenColor = "#166534"
greenBackgroundColor = "#E8F3E3"
greenTextColor = "#14532D"
orangeColor = "#B7791F"
orangeBackgroundColor = "#FFF3D6"
orangeTextColor = "#7C4A03"
redColor = "#B42318"
redBackgroundColor = "#FDE8E4"
redTextColor = "#8A1C12"
grayColor = "#66746B"
dataframeBorderColor = "#E0E8DC"
dataframeHeaderBackgroundColor = "#EEF4EA"
chartCategoricalColors = ["#14532D", "#4D7C0F", "#B7791F", "#0F766E", "#64748B", "#B42318"]
chartSequentialColors = ["#F7FBF2", "#E8F3E3", "#D2E7C7", "#B8D7A6", "#95C17E", "#72A95B", "#548A42", "#3D6D32", "#285123", "#173719"]

[theme.sidebar]
backgroundColor = "#F7FAF5"
